site_name: Indic OCR Pipeline
site_description: Extract RFQ Level 4 layout annotations from scanned Indic-language PDFs
site_url: https://github.com/rai8053/indic-ocr-pipeline
repo_url: https://github.com/rai8053/indic-ocr-pipeline
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - Architecture: architecture.md
  - Pipeline: pipeline.md
  - Providers: providers.md
  - Annotation Levels: annotation-levels.md
  - Validation: validation.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Examples: examples.md
  - Developer Guide: developer-guide.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
  - toc:
      permalink: true

plugins:
  - search
